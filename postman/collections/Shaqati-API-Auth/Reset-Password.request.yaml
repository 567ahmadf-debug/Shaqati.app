$kind: http-request
name: 'Reset Password'
method: POST
url: '{{base_url}}/api/reset-password'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "token": "{{reset_token}}",
      "email": "ahmad@example.com",
      "password": "NewPassword123!",
      "password_confirmation": "NewPassword123!"
    }
