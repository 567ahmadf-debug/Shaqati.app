$kind: http-request
name: 'Change Password'
method: POST
url: '{{base_url}}/api/change-password'
order: 5000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "current_password": "Password123!",
      "password": "NewPassword123!",
      "password_confirmation": "NewPassword123!"
    }
